services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraudai-backend
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    container_name: fraudai-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
